name: Main

on:
  workflow_dispatch:

jobs:
  get-commit-hash:
    name: Get Commit Hash
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_hash.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Short Commit Hash
        id: get_hash
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  Build:
    name: ${{ matrix.name }}
    needs: get-commit-hash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            buildArgs: "windows -release -final -D officialBuild"
            setupCommand: '.\setup\windows.bat'
            artifactName: windowsBuild-x86_64
            artifactPath: 'export/release/windows/bin/**'

          - name: Linux
            os: ubuntu-22.04
            buildArgs: "linux -release -final -D officialBuild"
            setupCommand: sh ./setup/unix.sh
            artifactName: linuxBuild-x86_64
            artifactPath: 'export/release/linux/bin/**'

          - name: macOS x86_64
            os: macos-13
            setupCommand: sh ./setup/unix.sh
            buildArgs: "mac -64 -release -final -D officialBuild"
            artifactName: macOSBuild-x86_64
            artifactPath: 'export/release/macos/bin/**'

          - name: macOS ARM64
            os: macos-13
            setupCommand: sh ./setup/unix.sh
            buildArgs: "mac -release -final -D officialBuild"
            artifactName: macOSBuild-arm64
            artifactPath: 'export/release/macos/bin/**'

          - name: Android
            os: ubuntu-latest
            buildArgs: "android -release -final -D officialBuild"
            setupCommand: sh ./setup/unix.sh
            artifactName: androidBuild
            artifactPath: "export/release/android/**/*.apk"

          - name: iOS
            os: macos-13
            buildArgs: "ios -release -final -nosign -D officialBuild"
            setupCommand: sh ./setup/unix.sh
            artifactName: iOSBuild
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"

    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      setupCommand: ${{ matrix.setupCommand }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}

  Releaser:
    name: Releaser
    needs: [get-commit-hash, Build]
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windowsBuild-x86_64
          path: /home/runner/artifacts/windows

      - name: Zip Windows Build
        run: zip -r /home/runner/Silence-Engine-Windows-x86_64.zip /home/runner/artifacts/windows || true

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linuxBuild-x86_64
          path: /home/runner/artifacts/linux

      - name: Zip Linux Build
        run: zip -r /home/runner/Silence-Engine-Linux-x86_64.zip /home/runner/artifacts/linux || true

      - name: Download macOS x86_64 Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macOSBuild-x86_64
          path: /home/runner/artifacts/macos-x86_64

      - name: Zip macOS x86_64 Build
        run: zip -r /home/runner/Silence-Engine-MacOS-x86_64.zip /home/runner/artifacts/macos-x86_64 || true

      - name: Download macOS ARM64 Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macOSBuild-arm64
          path: /home/runner/artifacts/macos-arm64

      - name: Zip macOS ARM64 Build
        run: zip -r /home/runner/Silence-Engine-MacOS-arm64.zip /home/runner/artifacts/macos-arm64 || true

      - name: Download Android Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: androidBuild
          path: /home/runner/artifacts/android

      - name: Move Android APK
        run: mv /home/runner/artifacts/android/*.apk /home/runner/Silence-Engine-Android.apk || true

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: iOSBuild
          path: /home/runner/artifacts/ios

      - name: Move iOS IPA
        run: mv /home/runner/artifacts/ios/*.ipa /home/runner/Silence-Engine-IOS.ipa || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          tag_name: "devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          prerelease: true
          files: |
            /home/runner/Silence-Engine-Windows-x86_64.zip
            /home/runner/Silence-Engine-Linux-x86_64.zip
            /home/runner/Silence-Engine-MacOS-x86_64.zip
            /home/runner/Silence-Engine-MacOS-arm64.zip
            /home/runner/Silence-Engine-Android.apk
            /home/runner/Silence-Engine-IOS.ipa
