name: Mobile + Release
on: workflow_dispatch

permissions:
  contents: write
  discussions: write

env:
  PROJECT_NAME: SilenceEngine
  VERSION: 1.1.0
  HAXE_VERSION: 4.3.7

jobs:
  get-commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit_hash.outputs.COMMIT_HASH }}
    steps:
      - name: Get latest commit hash
        id: get_commit_hash
        run: |
          commit_hash=${GITHUB_SHA::7}
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android
    needs: get-commit-hash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install Libraries
        run: sh ./setup/unix.sh

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Compile Android
        run: haxelib run lime build android -release -final -D officialBuild

      - name: Stage Android APK
        run: |
          mkdir -p staging
          cp export/release/android/bin/app/build/outputs/apk/release/*.apk staging/ 2>/dev/null || cp export/release/android/**/*.apk staging/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: staging/*

  build-ios:
    name: Build iOS
    needs: get-commit-hash
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Libraries
        shell: arch -x86_64 bash {0}
        run: sh ./setup/unix.sh

      - name: Compile iOS
        shell: arch -x86_64 bash {0}
        run: haxelib run lime build ios -release -final -nosign -D officialBuild

      - name: Make IPA
        shell: arch -x86_64 bash {0}
        run: |
          brew install ldid || true
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app || exit 1
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }} || true
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild
          path: export/release/ios/build/Release-iphoneos/*.ipa

  Releaser:
    needs: [get-commit-hash, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download Android Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
           name: AndroidBuild
           path: /home/runner/android_temp

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
           name: iOSBuild
           path: /home/runner/ios_temp

      - name: Prepare Release Files
        run: |
          mkdir -p /home/runner/release_files

          if compgen -G "/home/runner/android_temp/*.apk" > /dev/null; then
            mv /home/runner/android_temp/*.apk /home/runner/release_files/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-Android.apk
          fi

          if compgen -G "/home/runner/ios_temp/*.ipa" > /dev/null; then
            mv /home/runner/ios_temp/*.ipa /home/runner/release_files/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-iOS.ipa
          fi

      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          tag_name: "devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          prerelease: true
          files: |
            /home/runner/release_files/*
