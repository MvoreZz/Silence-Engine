name: Mobile + Release
on: workflow_dispatch

permissions:
  contents: write
  discussions: write

env:
  PROJECT_NAME: SilenceEngine
  VERSION: 1.1.0
  HAXE_VERSION: 4.3.7

jobs:
  get-commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit_hash.outputs.COMMIT_HASH }}
    steps:
      - name: Get latest commit hash
        id: get_commit_hash
        run: |
          commit_hash=${GITHUB_SHA::7}
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android
    needs: get-commit-hash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install Libraries
        run: |
          sh ./setup/unix.sh
          haxelib list

      - name: Force correct haxelib versions
        run: |
          haxelib set hxcpp git
          haxelib set lime git
          haxelib set flixel git
          haxelib set openfl 9.4.1
          haxelib set HtmlParser 3.4.0

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Compile Android
        run: haxelib run lime build android -release -final -D officialBuild

      - name: Stage Android APK
        run: |
          mkdir -p staging
          find export/release/android -name "*.apk" -exec cp {} staging/ \;
          if [ -z "$(ls -A staging)" ]; then
            echo "HATA: Derlenen APK bulunamadi!"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: staging/*

  build-ios:
    name: Build iOS
    needs: get-commit-hash
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Libraries
        run: |
          sh ./setup/unix.sh
          echo "=== Haxe Version ==="
          haxe -version
          echo "=== Haxelib List (before force set) ==="
          haxelib list

      - name: Force correct haxelib versions
        run: |
          haxelib set hxcpp git
          haxelib set lime git
          haxelib set flixel git
          haxelib set openfl 9.4.1
          haxelib set HtmlParser 3.4.0
          echo "=== Haxelib List (after force set) ==="
          haxelib list

      - name: Patch hxcpp for macOS 15 / Xcode 16
        shell: bash
        run: |
          ZUTIL="$HOME/haxelib/hxcpp/git/project/thirdparty/zlib-1.2.13/zutil.h"

          if [ ! -f "$ZUTIL" ]; then
            echo "zutil.h not found: $ZUTIL"
            exit 1
          fi

          perl -0pi -e 's/^[ \t]*#\s*define\s+fdopen\(fd,mode\)\s+NULL.*\R//m' "$ZUTIL"

          echo "=== fdopen check after patch ==="
          grep -n "fdopen" "$ZUTIL" || true

      - name: Clean iOS
        run: haxelib run lime clean ios || true

      - name: Compile iOS
        run: haxelib run lime build ios -release -final -nosign -D officialBuild

      - name: Make IPA
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild
          path: export/release/ios/build/Release-iphoneos/*.ipa

  Releaser:
    needs: [get-commit-hash, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download Android Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
           name: AndroidBuild
           path: /home/runner/android_temp

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
           name: iOSBuild
           path: /home/runner/ios_temp

      - name: Prepare Release Files
        run: |
          mkdir -p /home/runner/release_files

          if compgen -G "/home/runner/android_temp/*.apk" > /dev/null; then
            mv /home/runner/android_temp/*.apk /home/runner/release_files/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-Android.apk
          fi

          if compgen -G "/home/runner/ios_temp/*.ipa" > /dev/null; then
            mv /home/runner/ios_temp/*.ipa /home/runner/release_files/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-iOS.ipa
          fi

      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          tag_name: "devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          prerelease: true
          files: |
            /home/runner/release_files/*
