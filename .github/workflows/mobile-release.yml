name: Mobile + Release
on: workflow_dispatch

permissions:
  contents: write
  discussions: write

env:
  PROJECT_NAME: SilenceEngine
  VERSION: 1.1.0

jobs:
  get-commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit_hash.outputs.COMMIT_HASH }}
    steps:
      - name: Get latest commit hash
        id: get_commit_hash
        run: |
          commit_hash=${GITHUB_SHA::7}
          echo "Latest commit hash is $commit_hash"
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_OUTPUT

  build:
    name: ${{ matrix.name }}
    needs: get-commit-hash
    strategy:
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            buildArgs: "android -release -final -D officialBuild"
            setupCommand: sh ./setup/unix.sh
            artifactName: AndroidBuild
            artifactPath: "export/release/android/**/*.apk"
          - name: iOS
            os: macos-13
            setupCommand: sh ./setup/unix.sh
            buildArgs: "ios -release -final -nosign -D officialBuild"
            artifactName: iOSBuild
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"
    uses: ./.github/workflows/build.yml
    with:
        name: ${{ matrix.name }}
        os: ${{ matrix.os }}
        setupCommand: ${{ matrix.setupCommand }}
        buildArgs: ${{ matrix.buildArgs }}
        artifactName: ${{ matrix.artifactName }}
        artifactPath: ${{ matrix.artifactPath }}

  Releaser:
    needs: [get-commit-hash, build]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download Android Build
        uses: actions/download-artifact@v4.1.9
        with:
           name: AndroidBuild
           path: /home/runner/android_temp

      - name: Download iOS Build
        uses: actions/download-artifact@v4.1.9
        with:
           name: iOSBuild
           path: ${{ github.workspace }}

      - name: Package Zips For Release
        run: |
          mkdir -p /home/runner/release_files
          
          cd /home/runner/android_temp
          zip -j /home/runner/release_files/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-Android.zip *.apk
          
          cd ${{ github.workspace }}
          zip -j /home/runner/release_files/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-iOS.zip ${{ env.PROJECT_NAME }}.ipa

      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          tag_name: "devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          prerelease: true
          files: |
            /home/runner/release_files/*.zip
